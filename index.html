<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* One screen, no scrolling: everything is sized from --u, which tracks the
     smaller of the width and a 16:9 height, so it fits any TV. */
  :root {
    --u: min(1vw, 1.78vh);
    --felt: #0d3b2a;
    --felt-deep: #062418;
    --ink: #f4efe3;
    --muted: #a9bfb2;
    --line: rgba(244, 239, 227, 0.14);
    --card: rgba(6, 36, 24, 0.72);
    --gold: #e8c46a;
    --up: #7fe0a4;
    --down: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 15%, #17583f 0%, var(--felt) 45%, var(--felt-deep) 100%);
    background-color: var(--felt-deep);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: calc(var(--u) * 1.2);
  }
  .suits { position: fixed; inset: 0; pointer-events: none; z-index: 0; font-size: calc(var(--u) * 8); color: rgba(244, 239, 227, 0.035); }
  .suits span { position: absolute; animation: drift 28s linear infinite; }
  @keyframes drift { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-20vh) rotate(360deg); } }

  main {
    position: relative; z-index: 1; height: 100vh;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr);
    gap: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2);
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  .label { color: var(--muted); font-size: calc(var(--u) * 0.8); text-transform: uppercase; letter-spacing: 0.14em; }
  .up { color: var(--up); } .down { color: var(--down); }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6); min-height: 0; overflow: hidden;
  }
  .ptitle { font-family: "JetBrains Mono", monospace; color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; font-size: calc(var(--u) * 0.85); margin-bottom: calc(var(--u) * 0.6); }

  /* header */
  header { display: flex; justify-content: space-between; align-items: end; gap: 2vw; }
  .eyebrow { font-family: "JetBrains Mono", monospace; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); font-size: calc(var(--u) * 0.95); }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; margin: 0; font-size: calc(var(--u) * 4.6); line-height: 1; }
  .status { text-align: right; color: var(--muted); font-size: calc(var(--u) * 1.2); }
  .status .updated { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.8); margin-top: 0.3em; }
  .live-dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--down); margin-right: 0.4em; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* crew strip */
  .crew { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: calc(var(--u) * 1.2); }
  .player {
    background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.3);
    box-shadow: 0 1.5vh 4vh rgba(0, 0, 0, 0.35);
    animation: float 6s ease-in-out infinite;
  }
  .player:nth-child(2) { animation-delay: -1.2s; } .player:nth-child(3) { animation-delay: -2.4s; }
  .player:nth-child(4) { animation-delay: -3.6s; } .player:nth-child(5) { animation-delay: -4.8s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-0.4deg); } 50% { transform: translateY(-0.9vh) rotate(0.4deg); } }
  .rank { font-family: "JetBrains Mono", monospace; color: var(--gold); font-size: calc(var(--u) * 0.75); }
  .pname { font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 2.8); line-height: 1.05; }
  .big { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(var(--u) * 2); }
  .stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: calc(var(--u) * 0.4) calc(var(--u) * 0.8); margin-top: calc(var(--u) * 0.6); padding-top: calc(var(--u) * 0.6); border-top: 1px solid var(--line); }
  .stats .v { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.95); }
  .stats .label { font-size: calc(var(--u) * 0.65); white-space: nowrap; }
  .stats > div { white-space: nowrap; }
  .tonight { margin-top: calc(var(--u) * 0.7); padding: calc(var(--u) * 0.4) calc(var(--u) * 0.7); border-radius: calc(var(--u) * 0.7); background: rgba(232, 196, 106, 0.12); display: flex; justify-content: space-between; align-items: baseline; }
  .tonight .big { font-size: calc(var(--u) * 1.4); }

  /* newcomer */
  .newcomer {
    position: relative; overflow: hidden; text-align: center;
    background: linear-gradient(135deg, rgba(232,196,106,0.2), rgba(6,36,24,0.88) 60%);
    border: 2px solid var(--gold);
    animation: arrive 1.2s cubic-bezier(.2,1.4,.4,1) both, glow 2.8s ease-in-out 1.2s infinite, float 6s ease-in-out 1.2s infinite;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--u) * 0.4);
  }
  .newcomer::before {
    content: ""; position: absolute; inset: -60%;
    background: conic-gradient(from 0deg, transparent 0 70%, rgba(232,196,106,0.35) 80%, transparent 90%);
    animation: spin 5s linear infinite; z-index: -1;
  }
  .stamp {
    display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: 0.3em;
    padding: 0.3em 0.8em; border: 0.18em solid var(--gold); border-radius: 0.4em; font-size: calc(var(--u) * 1.1);
    transform: rotate(-6deg); color: var(--gold);
    animation: stamp 0.6s cubic-bezier(.3,1.8,.5,1) 0.9s both, shimmer 2.4s linear 1.5s infinite;
    background: linear-gradient(90deg, var(--gold) 0%, #fff4cf 50%, var(--gold) 100%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .newcomer .pname { font-size: calc(var(--u) * 3.4); }
  .nc-sub { color: var(--muted); font-size: calc(var(--u) * 0.85); }
  @keyframes arrive { from { opacity: 0; transform: translateY(6vh) scale(0.85); } }
  @keyframes glow { 50% { box-shadow: 0 0 5vh rgba(232,196,106,0.45); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(3); } }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* tonight */
  .night { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: calc(var(--u) * 1.2); min-height: 0; }
  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: calc(var(--u) * 1.2); min-height: 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: calc(var(--u) * 0.45) calc(var(--u) * 0.3); text-align: left; font-size: calc(var(--u) * 1.15); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: calc(var(--u) * 0.72); text-transform: uppercase; letter-spacing: 0.12em; }
  tr + tr td { border-top: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-family: "JetBrains Mono", monospace; }
  .crown { color: var(--gold); }
  .pays { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 16), 1fr)); gap: 0 calc(var(--u) * 2); }
  .pay { display: flex; justify-content: space-between; gap: 1em; padding: calc(var(--u) * 0.3) 0; font-size: calc(var(--u) * 1.1); border-top: 1px solid var(--line); }
  .pay .arrow { color: var(--muted); }
  .headline { font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 2.4); line-height: 1.1; }
  .recap-text { font-size: calc(var(--u) * 1.1); margin: calc(var(--u) * 0.4) 0 calc(var(--u) * 0.6); }
  .roast { display: grid; grid-template-columns: calc(var(--u) * 7) 1fr; gap: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.35) 0; border-top: 1px solid var(--line); font-size: calc(var(--u) * 0.98); }
  .roast .who { font-weight: 700; color: var(--gold); }
  .recap .mini { margin-top: calc(var(--u) * 0.6); }
  .recap .mini td { font-size: calc(var(--u) * 0.9); padding: calc(var(--u) * 0.2) calc(var(--u) * 0.3); }
  .welcome { display: grid; place-items: center; text-align: center; }
  .welcome .headline { font-size: calc(var(--u) * 3.2); }
  .welcome p { color: var(--muted); font-size: calc(var(--u) * 1.3); }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 0.4vh var(--gold); } }

  /* full-screen recap */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 4vh 5vw;
    background: rgba(3, 18, 12, 0.93); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity 0.6s;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .recap-big { max-width: 110vh; width: 100%; max-height: 92vh; overflow: hidden; }
  .recap-big .headline { font-size: calc(var(--u) * 5.2); }
  .recap-big .recap-text { font-size: calc(var(--u) * 1.7); }
  .recap-big .roast { font-size: calc(var(--u) * 1.6); grid-template-columns: calc(var(--u) * 11) 1fr; padding: calc(var(--u) * 0.6) 0; }
  .overlay.on .recap-big { animation: arrive 0.9s cubic-bezier(.2,1.3,.4,1) both; }
  .overlay.on .roast { animation: arrive 0.7s ease-out both; }
  .overlay.on .roast:nth-of-type(1) { animation-delay: .6s } .overlay.on .roast:nth-of-type(2) { animation-delay: 1.2s }
  .overlay.on .roast:nth-of-type(3) { animation-delay: 1.8s } .overlay.on .roast:nth-of-type(4) { animation-delay: 2.4s }
  .overlay.on .roast:nth-of-type(5) { animation-delay: 3s } .overlay.on .roast:nth-of-type(6) { animation-delay: 3.6s }
  .overlay.on .roast:nth-of-type(n+7) { animation-delay: 4.2s }

  /* pre-game: the crew cards take the stage */
  body.pregame .stats { grid-template-columns: 1fr 1fr; justify-content: stretch; }
  .player { border-top: 0.5vh solid var(--c, var(--line)); }
  .newcomer { border-top-width: 2px; }

  /* bankroll chart */
  .chart { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-column: 1 / -1; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; }
  .chart-head .sub { color: var(--muted); font-size: calc(var(--u) * 1); }
  .legend { display: flex; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 0.95); }
  .legend span::before { content: ""; display: inline-block; width: 1.4em; height: 0.25em; border-radius: 1em; background: var(--c); margin-right: 0.45em; vertical-align: middle; }
  .plot { position: relative; min-height: 0; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .plot .grid line { stroke: rgba(244,239,227,0.08); }
  .plot .zero { stroke: rgba(244,239,227,0.35); stroke-dasharray: 4 6; }
  .plot text { fill: var(--muted); font-family: "JetBrains Mono", monospace; }
  .plot .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .plot .series.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: drawline 2.4s ease-out forwards; }
  @keyframes drawline { to { stroke-dashoffset: 0; } }
  .plot .end { stroke: var(--felt-deep); stroke-width: 3; }
  .plot .lbl-name { fill: var(--ink); font-family: "Instrument Sans", sans-serif; font-weight: 700; }
  .plot .lbl-val { fill: var(--muted); }

  /* rotating stat slides */
  .chart { grid-template-rows: auto minmax(0, 1fr) auto; }
  .plot { transition: opacity .45s ease, transform .45s ease; }
  .plot.out { opacity: 0; transform: translateY(1.2vh); }
  .dots { display: flex; gap: calc(var(--u) * 0.5); justify-content: center; padding-top: calc(var(--u) * 0.6); }
  .dots i { width: calc(var(--u) * 2.2); height: 0.45vh; border-radius: 1vh; background: rgba(244,239,227,0.15); overflow: hidden; }
  .dots i.on::after { content: ""; display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; animation: fillbar var(--dur) linear forwards; }
  @keyframes fillbar { from { transform: scaleX(0); } }
  .pop { animation: pop .6s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  .grow { animation: grow .9s cubic-bezier(.2,1,.3,1) both; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } }
  .fit { position: absolute; inset: 0; display: grid; }
  .who-c { font-weight: 700; }

  .h2h { grid-template-columns: auto repeat(var(--n), minmax(0, 1fr)); gap: calc(var(--u) * 0.5); align-content: center; }
  .h2h .hd { text-align: center; font-weight: 700; font-size: calc(var(--u) * 1.2); align-self: end; padding-bottom: .3em; }
  .h2h .rl { font-weight: 700; font-size: calc(var(--u) * 1.3); align-self: center; padding-right: 1em; text-align: right; }
  .h2h .cell { border-radius: calc(var(--u) * 0.7); display: grid; place-items: center; text-align: center; padding: calc(var(--u) * 0.5); min-height: 0; }
  .h2h .cell b { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 1.9); display: block; }
  .h2h .cell small { color: var(--ink); opacity: .75; font-size: calc(var(--u) * 0.8); }
  .h2h .self { background: rgba(244,239,227,0.04); color: var(--muted); }

  .nem { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: calc(var(--u) * 1.2); align-content: center; }
  .nem article { border-radius: calc(var(--u) * 1); background: rgba(0,0,0,0.18); border-top: 0.5vh solid var(--c); padding: calc(var(--u) * 1.1); display: grid; gap: calc(var(--u) * 0.7); }
  .nem .me { font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 2.4); line-height: 1; }
  .nem .k { font-family: "JetBrains Mono", monospace; letter-spacing: .2em; font-size: calc(var(--u) * 0.75); color: var(--muted); }
  .nem .v { font-size: calc(var(--u) * 1.7); font-weight: 700; }
  .nem .amt { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 1.05); }

  .bars { align-content: center; gap: calc(var(--u) * 0.75); }
  .bar-row { display: grid; grid-template-columns: calc(var(--u) * 17) minmax(0, 1fr) calc(var(--u) * 7); align-items: center; gap: calc(var(--u) * 1); font-size: calc(var(--u) * 1.3); }
  .bar-row .track { height: calc(var(--u) * 1.6); }
  .bar-row .fill { height: 100%; border-radius: 0 calc(var(--u) * 0.4) calc(var(--u) * 0.4) 0; }
  .bar-row .val { font-family: "JetBrains Mono", monospace; text-align: right; }
  .twocol { grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3); align-content: center; }
  .twocol h3 { margin: 0 0 .6em; font-family: "DM Serif Display", serif; font-weight: 400; font-size: calc(var(--u) * 1.9); }
  .twocol .bar-row { grid-template-columns: calc(var(--u) * 12) minmax(0, 1fr) calc(var(--u) * 6.5); margin-bottom: calc(var(--u) * 0.6); }
  .twocol .date { display: block; color: var(--muted); font-size: calc(var(--u) * 0.75); font-family: "JetBrains Mono", monospace; }

  .heat { grid-template-columns: auto repeat(var(--m), minmax(0, 1fr)); gap: 3px; align-content: center; }
  .heat .hd { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.72); color: var(--muted); text-align: center; padding-bottom: .4em; }
  .heat .rl { font-weight: 700; font-size: calc(var(--u) * 1.2); padding-right: 1em; align-self: center; text-align: right; }
  .heat .cell { height: calc(var(--u) * 3.6); border-radius: 4px; display: grid; place-items: center; font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.85); }

  .tape { grid-template-columns: auto repeat(var(--n), minmax(0, 1fr)); align-content: center; row-gap: 0; }
  .tape > div { padding: calc(var(--u) * 0.55) calc(var(--u) * 0.6); border-top: 1px solid var(--line); text-align: center; font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 1.4); }
  .tape > .hd { border-top: 0; font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 1.9); }
  .tape > .rl { text-align: right; font-family: "Instrument Sans", sans-serif; color: var(--muted); font-size: calc(var(--u) * 0.95); text-transform: uppercase; letter-spacing: .1em; }
  .tape .lead { color: var(--gold); }
  .tape .lead::before { content: "♛ "; }
  .tape .shame { color: var(--down); }
  .tape .shame::before { content: "💀 "; }

  @media (prefers-reduced-motion: reduce) {
    .player, .suits span, .live-dot, .newcomer, .newcomer::before, .stamp, .roast, .recap-big { animation: none !important; }
  }
</style>
</head>
<body>
<div class="suits" aria-hidden="true">
  <span style="left:6%;animation-delay:-2s">♠</span>
  <span style="left:28%;animation-delay:-11s">♥</span>
  <span style="left:52%;animation-delay:-19s">♣</span>
  <span style="left:77%;animation-delay:-6s">♦</span>
  <span style="left:90%;animation-delay:-24s">♠</span>
</div>
<main>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Tonight</div>
      <h1 id="title">Poker Night</h1>
    </div>
    <div class="status"><div id="status">Loading…</div><div class="updated" id="updated"></div></div>
  </header>
  <section class="crew" id="crew"></section>
  <section class="night" id="night"></section>
</main>
<div id="overlay" class="overlay" aria-live="polite"></div>

<script>
const money = v => (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(2);
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lastStamp = null;
let colors = {};
let lastData = null;

function crewCard(p, i) {
  return `
    <article class="player" style="--c:${colors[p.name] || "var(--line)"}">
      <div class="rank">#${i + 1} OF THE CREW</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="label">Lifetime</div>
      <div class="big ${cls(p.lifetime_net)}">${money(p.lifetime_net)}</div>
      <div class="stats">
        <div><div class="label">Record</div><div class="v">${p.wins}–${p.losses}</div></div>
        <div><div class="label">Win %</div><div class="v">${p.win_rate}%</div></div>
        <div><div class="label">Best</div><div class="v up">${money(p.best_night)}</div></div>
        <div><div class="label">Worst</div><div class="v down">${money(p.worst_night)}</div></div>
      </div>
      ${p.tonight != null ? `<div class="tonight"><span class="label">Tonight</span><span class="big ${cls(p.tonight)}">${money(p.tonight)}</span></div>` : ""}
    </article>`;
}

function newcomerCard(n) {
  return `
    <article class="player newcomer">
      <div class="stamp">NEWCOMER</div>
      <div class="pname">${esc(n.name)}</div>
      ${n.tonight != null
        ? `<div class="big ${cls(n.tonight)}">${money(n.tonight)}</div><div class="label">tonight</div>`
        : `<div class="nc-sub">First night at the table<br>Record: blank · Fear level: pending</div>`}
    </article>`;
}

function recapBlock(g, big) {
  const r = g.recap || {};
  const lines = Object.entries(r.lines || {}).map(([n, l]) =>
    `<div class="roast"><span class="who">${esc(n)}</span><span>${esc(l)}</span></div>`).join("");
  return `
    <div class="${big ? "recap-big" : "panel recap"}">
      <div class="ptitle">Game ${g.n} recap</div>
      <div class="headline">${esc(r.headline || "")}</div>
      <div class="recap-text">${esc(r.recap || "")}</div>
      ${lines}
    </div>`;
}

function renderNight(d) {
  if (!d.games.length) {
    return `<div class="panel chart">
      <div class="chart-head">
        <div><div class="ptitle" id="s-title"></div><div class="sub" id="s-sub"></div></div>
        <div class="legend" id="s-legend"></div>
      </div>
      <div class="plot" id="plot"></div>
      <div class="dots" id="s-dots"></div></div>`;
  }
  const standings = d.standings.map((s, i) => `
    <tr><td>${i === 0 && s.net > 0 ? '<span class="crown">♛</span> ' : ""}${esc(s.name)}</td>
    <td class="num">${s.won}/${s.games}</td>
    <td class="num up">${money(s.best)}</td>
    <td class="num down">${money(s.worst)}</td>
    <td class="num">${s.rebuys}</td>
    <td class="num">${s.busts}</td>
    <td class="num">$${s.bought_in.toFixed(0)}</td>
    <td class="num ${cls(s.net)}"><b>${money(s.net)}</b></td></tr>`).join("");
  const pays = d.settlements.length
    ? d.settlements.map(t => `<div class="pay"><span>${esc(t.from)} <span class="arrow">→</span> ${esc(t.to)}</span><span class="mono">$${t.amount.toFixed(2)}</span></div>`).join("")
    : `<div class="label">All square.</div>`;
  return `
    <div class="panel">
      <div class="ptitle">Tonight · ${d.games.length} game${d.games.length > 1 ? "s" : ""}</div>
      <table>
        <tr><th>Player</th><th class="num">Won</th><th class="num">Best</th><th class="num">Worst</th><th class="num">Rebuys</th><th class="num">Busts</th><th class="num">In</th><th class="num">Net</th></tr>
        ${standings}</table>
    </div>
    <div class="right">
      ${recapBlock(d.games[d.games.length - 1], false)}
      <div class="panel"><div class="ptitle">Who pays who</div><div class="pays">${pays}</div></div>
    </div>`;
}


// Cumulative-net line per crew member on a shared date axis, direct-labelled at the line ends.
function drawChart(d, animate) {
  const el = document.getElementById("plot");
  if (!el) return;
  const W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;
  const u = Math.min(innerWidth / 100, innerHeight * 1.78 / 100);
  const fs = u * 0.95;
  const series = Object.entries(d.history || {}).map(([name, pts]) =>
    ({ name, pts: pts.map(([t, v]) => [Date.parse(t + "T12:00:00"), v]) }));
  if (!series.length) return;
  const all = series.flatMap(s => s.pts);
  const x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(0, ...all.map(p => p[1])), y1 = Math.max(0, ...all.map(p => p[1]));
  const step = [10, 25, 50, 100, 200, 500].find(s => (y1 - y0) / s <= 6) || 1000;
  y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const m = { l: fs * 4.5, r: fs * 11, t: fs * 1.2, b: fs * 2.2 };
  const X = t => m.l + (t - x0) / Math.max(1, x1 - x0) * (W - m.l - m.r);
  const Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  const fmt = v => (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(0);

  let grid = "";
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/>`
          + `<text x="${m.l - fs * 0.6}" y="${Y(v) + fs * 0.35}" text-anchor="end" font-size="${fs}">${fmt(v)}</text>`;
  }
  // x ticks: first of each quarter
  let ticks = "";
  const start = new Date(x0), end = new Date(x1);
  for (let dt = new Date(start.getFullYear(), Math.floor(start.getMonth() / 3) * 3 + 3, 1); dt <= end; dt.setMonth(dt.getMonth() + 3)) {
    const x = X(dt.getTime());
    ticks += `<text x="${x}" y="${H - fs * 0.4}" text-anchor="middle" font-size="${fs}">${dt.toLocaleDateString(undefined, { month: "short", year: "2-digit" })}</text>`;
  }

  // end labels, nudged apart so they never collide
  const ends = series.map(s => ({ s, y: Y(s.pts[s.pts.length - 1][1]) })).sort((a, b) => a.y - b.y);
  const gap = fs * 2.3;
  for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + gap);
  const over = ends.length ? ends[ends.length - 1].y - (H - m.b) : 0;
  if (over > 0) ends.forEach(e => e.y -= over);

  const lines = series.map(s => {
    const pts = s.pts.map(([t, v]) => [X(t), Y(v)]);
    const path = "M" + pts.map(p => p.map(n => n.toFixed(1)).join(",")).join("L");
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const [ex, ey] = pts[pts.length - 1];
    const lab = ends.find(e => e.s === s).y;
    const last = s.pts[s.pts.length - 1][1];
    return `<path class="series${animate ? " draw" : ""}" style="--len:${Math.ceil(len)}" stroke="${colors[s.name]}" d="${path}"/>
      <circle class="end" cx="${ex}" cy="${ey}" r="${fs * 0.45}" fill="${colors[s.name]}"/>
      <text class="lbl-name" x="${W - m.r + fs * 1.2}" y="${lab}" font-size="${fs * 1.2}">${esc(s.name)}</text>
      <text class="lbl-val" x="${W - m.r + fs * 1.2}" y="${lab + fs * 1.05}" font-size="${fs * 0.9}">${(last < 0 ? "−$" : "+$") + Math.abs(last).toFixed(2)}</text>`;
  }).join("");

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative winnings over time for ${series.map(s => s.name).join(", ")}">
    <g class="grid">${grid}</g>
    <line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}"/>
    ${ticks}${lines}</svg>`;
}


// ---- rotating stat slides (pre-game) ---------------------------------------
const SLIDE_MS = 14000;
const crewOrder = d => d.featured.map(f => f.name);
const cname = n => `<span class="who-c" style="color:${colors[n] || "var(--ink)"}">${esc(n)}</span>`;
const dollars = v => (v < 0 ? "−$" : "$") + Math.abs(v).toFixed(2);
// diverging fill for win/loss cells: green above even, red below, faint at even
function divFill(t) { // t in [-1, 1]
  const a = (0.1 + Math.min(1, Math.abs(t)) * 0.55).toFixed(2);
  return t >= 0 ? `rgba(127,224,164,${a})` : `rgba(255,138,122,${a})`;
}

const SLIDES = [
  { title: "All-time bankroll", sub: "Cumulative winnings, night by night", legend: true,
    render: (el, d) => drawChart(d, true) },

  { title: "Head to head", sub: "Row finishes ahead of column, in games they both played",
    render: (el, d) => {
      const names = crewOrder(d), H = d.stats.h2h;
      let html = `<div></div>` + names.map(n => `<div class="hd">${cname(n)}</div>`).join("");
      let k = 0;
      names.forEach(a => {
        html += `<div class="rl">${cname(a)}</div>`;
        names.forEach(b => {
          if (a === b) { html += `<div class="cell self">—</div>`; return; }
          const w = H[a][b].ahead, l = H[b][a].ahead, g = H[a][b].games;
          const t = w + l ? (w - l) / (w + l) : 0;
          html += `<div class="cell pop" style="background:${divFill(t)};animation-delay:${(k++ * 0.08).toFixed(2)}s">
            <div><b>${w}–${l}</b><small>${g} games together</small></div></div>`;
        });
      });
      el.innerHTML = `<div class="fit h2h" style="--n:${names.length}">${html}</div>`;
    } },

  { title: "Nemesis & personal ATM", sub: "Who's taken the most off you, and who's paid you the most, all time",
    render: (el, d) => {
      const order = crewOrder(d);
      const rows = [...d.stats.nemesis].sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name));
      el.innerHTML = `<div class="fit nem" style="--n:${rows.length}">${rows.map((r, i) => `
        <article class="pop" style="--c:${colors[r.name]};animation-delay:${i * 0.15}s">
          <div class="me" style="color:${colors[r.name]}">${esc(r.name)}</div>
          <div><div class="k">☠ NEMESIS</div><div class="v">${esc(r.nemesis || "nobody yet")}</div>
            <div class="amt down">has taken ${dollars(r.paid)}</div></div>
          <div><div class="k">$ PERSONAL ATM</div><div class="v">${esc(r.atm || "nobody yet")}</div>
            <div class="amt up">has paid ${dollars(r.received)}</div></div>
        </article>`).join("")}</div>`;
    } },

  { title: "Follow the money", sub: "Net cash that's changed hands inside the crew, all time",
    render: (el, d) => {
      const F = d.stats.flow, pairs = [];
      Object.keys(F).forEach(a => Object.keys(F[a]).forEach(b => { if (F[a][b] > 0.5) pairs.push({ to: a, from: b, amt: F[a][b] }); }));
      pairs.sort((x, y) => y.amt - x.amt);
      const max = Math.max(...pairs.map(p => p.amt), 1);
      el.innerHTML = `<div class="fit bars">${pairs.map((p, i) => `
        <div class="bar-row"><div>${cname(p.from)} <span style="color:var(--muted)">→</span> ${cname(p.to)}</div>
          <div class="track"><div class="fill grow" style="width:${(p.amt / max * 100).toFixed(1)}%;background:linear-gradient(90deg, ${colors[p.from]}, ${colors[p.to]});animation-delay:${i * 0.12}s"></div></div>
          <div class="val">${dollars(p.amt)}</div></div>`).join("")}</div>`;
    } },

  { title: "Hall of fame · hall of shame", sub: "Biggest single-game wins and losses in crew history",
    render: (el, d) => {
      const col = (list, cls) => {
        const max = Math.max(...list.map(b => Math.abs(b.net)), 1);
        return list.map((b, i) => `
          <div class="bar-row"><div>${cname(b.name)}<span class="date">${new Date(b.date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span></div>
            <div class="track"><div class="fill grow" style="width:${(Math.abs(b.net) / max * 100).toFixed(1)}%;background:var(--${cls});animation-delay:${i * 0.12}s"></div></div>
            <div class="val ${cls}">${money(b.net)}</div></div>`).join("");
      };
      el.innerHTML = `<div class="fit twocol">
        <div><h3>🏆 Fame</h3>${col(d.stats.fame, "up")}</div>
        <div><h3>💀 Shame</h3>${col(d.stats.shame, "down")}</div></div>`;
    } },

  { title: "Every game ever", sub: "One dot per game · the white tick is each player's average", legend: true,
    render: (el, d) => {
      const W = el.clientWidth, H = el.clientHeight;
      const u = Math.min(innerWidth / 100, innerHeight * 1.78 / 100), fs = u * 0.95;
      const names = crewOrder(d), S = d.stats.swings;
      const all = names.flatMap(n => S[n] || []);
      const lo = Math.floor(Math.min(-20, ...all) / 10) * 10, hi = Math.ceil(Math.max(20, ...all) / 10) * 10;
      const m = { l: fs * 7, r: fs * 9, t: fs * 0.5, b: fs * 2.2 };
      const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
      const rowH = (H - m.t - m.b) / names.length;
      let g = "";
      for (let v = lo; v <= hi; v += 10)
        g += `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H - m.b}" stroke="rgba(244,239,227,${v === 0 ? 0.35 : 0.08})" ${v === 0 ? 'stroke-dasharray="4 6"' : ""}/>
              <text x="${X(v)}" y="${H - fs * 0.4}" text-anchor="middle" font-size="${fs}">${v < 0 ? "−$" : "$"}${Math.abs(v)}</text>`;
      let k = 0;
      names.forEach((n, i) => {
        const cy = m.t + rowH * (i + 0.5), vals = S[n] || [];
        const avg = vals.reduce((a, b) => a + b, 0) / Math.max(1, vals.length);
        g += `<text x="${m.l - fs}" y="${cy + fs * 0.4}" text-anchor="end" font-size="${fs * 1.3}" class="lbl-name">${esc(n)}</text>`;
        vals.forEach((v, j) => {
          const jit = ((j * 37) % 11 - 5) / 5 * rowH * 0.28;   // deterministic jitter
          g += `<circle class="pop" style="animation-delay:${(k++ * 0.012).toFixed(3)}s;transform-box:fill-box;transform-origin:center" cx="${X(v)}" cy="${cy + jit}" r="${fs * 0.42}" fill="${colors[n]}" fill-opacity="0.75" stroke="#062418" stroke-width="1.5"/>`;
        });
        g += `<line x1="${X(avg)}" x2="${X(avg)}" y1="${cy - rowH * 0.4}" y2="${cy + rowH * 0.4}" stroke="#f4efe3" stroke-width="3" stroke-linecap="round"/>
              <text x="${W - m.r + fs}" y="${cy + fs * 0.35}" font-size="${fs}" class="lbl-val">avg ${avg < 0 ? "−$" : "+$"}${Math.abs(avg).toFixed(2)}</text>`;
      });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Every game result per player">${g}</svg>`;
    } },

  { title: "Month by month", sub: "Net winnings each month · blank means they sat it out",
    render: (el, d) => {
      const names = crewOrder(d), M = d.stats.months;
      let html = `<div></div>` + M.cols.map(c => {
        const [y, mo] = c.split("-");
        return `<div class="hd">${new Date(+y, +mo - 1, 1).toLocaleDateString(undefined, { month: "short" })}<br>${y.slice(2)}</div>`;
      }).join("");
      let k = 0;
      names.forEach(n => {
        html += `<div class="rl">${cname(n)}</div>`;
        (M.rows[n] || []).forEach(v => {
          html += v == null
            ? `<div class="cell" style="background:rgba(244,239,227,0.03)"></div>`
            : `<div class="cell pop" style="background:${divFill(v / 40)};animation-delay:${(k++ * 0.02).toFixed(2)}s">${v < 0 ? "−" : "+"}${Math.abs(v).toFixed(0)}</div>`;
        });
      });
      el.innerHTML = `<div class="fit heat" style="--m:${M.cols.length}">${html}</div>`;
    } },

  { title: "Tale of the tape", sub: "The numbers that settle arguments",
    render: (el, d) => {
      const names = crewOrder(d);
      const R = Object.fromEntries(d.stats.records.map(r => [r.name, r]));
      const streak = s => s > 0 ? `🔥 W${s}` : s < 0 ? `🧊 L${-s}` : "—";
      const metrics = [
        ["Games played", r => r.games, "max"],
        ["Cash rate", r => r.cashed, "max", v => v + "%"],
        ["Avg per game", r => r.avg, "max", v => (v < 0 ? "−$" : "+$") + Math.abs(v).toFixed(2)],
        ["Longest win streak", r => r.win_streak, "max"],
        ["Current streak", r => r.streak, "max", streak],
        ["Times busted", r => r.busts, "shame"],
      ];
      let html = `<div></div>` + names.map(n => `<div class="hd">${cname(n)}</div>`).join("");
      metrics.forEach(([label, get, dir, fmt], i) => {
        const vals = names.map(n => get(R[n] || {}));
        const best = Math.max(...vals);
        html += `<div class="rl">${label}</div>` + vals.map((v, j) =>
          `<div class="pop ${v === best && best > 0 ? (dir === "shame" ? "shame" : "lead") : ""}" style="animation-delay:${(i * 0.1 + j * 0.05).toFixed(2)}s">${fmt ? fmt(v) : v}</div>`).join("");
      });
      el.innerHTML = `<div class="fit tape" style="--n:${names.length}">${html}</div>`;
    } },
];

let slideIdx = 0;
function renderSlide(animate = true) {
  const d = lastData, el = document.getElementById("plot");
  if (!el || !d || !d.stats) return;
  const sl = SLIDES[slideIdx];
  document.getElementById("s-title").textContent = sl.title;
  document.getElementById("s-sub").textContent = sl.sub;
  const names = crewOrder(d);
  document.getElementById("s-legend").innerHTML = sl.legend
    ? names.map(n => `<span style="--c:${colors[n]}">${esc(n)}</span>`).join("") : "";
  document.getElementById("s-dots").innerHTML = SLIDES.map((_, i) =>
    `<i class="${i === slideIdx ? "on" : ""}" style="--dur:${SLIDE_MS}ms"></i>`).join("");
  el.innerHTML = "";
  try { sl.render(el, d); } catch (e) { console.error(e); }
}
function nextSlide() {
  const el = document.getElementById("plot");
  if (!el || !lastData || lastData.games.length) return;
  el.classList.add("out");
  setTimeout(() => {
    slideIdx = (slideIdx + 1) % SLIDES.length;
    renderSlide();
    el.classList.remove("out");
  }, 450);
}
setInterval(nextSlide, SLIDE_MS);

// Full-screen recap once per game, and again when the real roast replaces the auto one.
let shown = null;
const recapKey = g => g.id + ":" + ((g.recap || {}).auto ? "a" : "r");
function maybeShowRecap(d, first) {
  if (!d.games.length) return;
  const g = d.games[d.games.length - 1];
  const key = recapKey(g);
  if (first) { shown = key; return; }
  if (key === shown) return;
  shown = key;
  const ov = document.getElementById("overlay");
  ov.innerHTML = recapBlock(g, true);
  ov.classList.add("on");
  clearTimeout(ov._t);
  ov._t = setTimeout(() => ov.classList.remove("on"), 35000);
}
document.getElementById("overlay").addEventListener("click", e => e.currentTarget.classList.remove("on"));

// Shrink a panel's text a notch at a time if a big table ever overflows it.
// Every size is derived from --u, so scaling --u on the panel scales it all.
function fit() {
  document.querySelectorAll(".night .panel").forEach(p => {
    p.style.removeProperty("--u");
    for (let s = 0.95; p.scrollHeight > p.clientHeight + 2 && s >= 0.55; s -= 0.05) {
      p.style.setProperty("--u", `calc(min(1vw, 1.78vh) * ${s.toFixed(2)})`);
    }
  });
}
window.addEventListener("resize", () => { fit(); if (lastData && !lastData.games.length) renderSlide(false); });
if (document.fonts) document.fonts.ready.then(fit);

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    if (d.updated_at === lastStamp) return;
    const first = lastStamp === null;
    lastStamp = d.updated_at;
    colors = d.colors || {};
    lastData = d;
    document.title = `${d.title} at ${d.host}`;
    document.getElementById("eyebrow").textContent =
      new Date(d.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    document.getElementById("title").textContent = `${d.title} at ${d.host}`;
    document.getElementById("status").innerHTML = d.games.length
      ? `<span class="live-dot"></span>Live · ${d.games.length} game${d.games.length > 1 ? "s" : ""} in the books`
      : "Getting set up";
    document.getElementById("crew").innerHTML =
      d.featured.map(crewCard).join("") + (d.newcomers || []).map(newcomerCard).join("");
    document.body.classList.toggle("pregame", !d.games.length);
    const night = document.getElementById("night");
    night.innerHTML = renderNight(d);
    if (!d.games.length) renderSlide(false);
    fit();
    setTimeout(fit, 800);
    if (!first) night.querySelectorAll(".panel").forEach(p => p.classList.add("flash"));
    maybeShowRecap(d, first);
    document.getElementById("updated").textContent =
      "Updated " + new Date(d.updated_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    if (lastStamp === null) document.getElementById("status").textContent = "Couldn't load results. Retrying…";
  }
}

// Reload by itself when the page code changes, so the TV never needs a manual refresh.
let pageSig = null;
async function checkPage() {
  try {
    const t = await (await fetch("index.html?t=" + Date.now(), { cache: "no-store" })).text();
    const sig = t.length + ":" + t.slice(-400);
    if (pageSig && sig !== pageSig) location.reload();
    pageSig = pageSig || sig;
  } catch (e) {}
}

load();
checkPage();
setInterval(load, 20000);
setInterval(checkPage, 60000);
</script>
