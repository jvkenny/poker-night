<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* One screen, no scrolling: everything is sized from --u, which tracks the
     smaller of the width and a 16:9 height, so it fits any TV. */
  :root {
    --u: min(1vw, 1.78vh);
    --felt: #0d3b2a;
    --felt-deep: #062418;
    --ink: #f4efe3;
    --muted: #a9bfb2;
    --line: rgba(244, 239, 227, 0.14);
    --card: rgba(6, 36, 24, 0.72);
    --gold: #e8c46a;
    --up: #7fe0a4;
    --down: #ff8a7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 15%, #17583f 0%, var(--felt) 45%, var(--felt-deep) 100%);
    background-color: var(--felt-deep);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: calc(var(--u) * 1.2);
  }
  .suits { position: fixed; inset: 0; pointer-events: none; z-index: 0; font-size: calc(var(--u) * 8); color: rgba(244, 239, 227, 0.035); }
  .suits span { position: absolute; animation: drift 28s linear infinite; }
  @keyframes drift { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-20vh) rotate(360deg); } }

  main {
    position: relative; z-index: 1; height: 100vh;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr);
    gap: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2);
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  .label { color: var(--muted); font-size: calc(var(--u) * 0.8); text-transform: uppercase; letter-spacing: 0.14em; }
  .up { color: var(--up); } .down { color: var(--down); }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6); min-height: 0; overflow: hidden;
  }
  .ptitle { font-family: "JetBrains Mono", monospace; color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; font-size: calc(var(--u) * 0.85); margin-bottom: calc(var(--u) * 0.6); }

  /* header */
  header { display: flex; justify-content: space-between; align-items: end; gap: 2vw; }
  .eyebrow { font-family: "JetBrains Mono", monospace; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); font-size: calc(var(--u) * 0.95); }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; margin: 0; font-size: calc(var(--u) * 4.6); line-height: 1; }
  .status { text-align: right; color: var(--muted); font-size: calc(var(--u) * 1.2); }
  .status .updated { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.8); margin-top: 0.3em; }
  .live-dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--down); margin-right: 0.4em; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* crew strip */
  .crew { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: calc(var(--u) * 1.2); }
  .player {
    background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.3);
    box-shadow: 0 1.5vh 4vh rgba(0, 0, 0, 0.35);
    animation: float 6s ease-in-out infinite;
  }
  .player:nth-child(2) { animation-delay: -1.2s; } .player:nth-child(3) { animation-delay: -2.4s; }
  .player:nth-child(4) { animation-delay: -3.6s; } .player:nth-child(5) { animation-delay: -4.8s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-0.4deg); } 50% { transform: translateY(-0.9vh) rotate(0.4deg); } }
  .rank { font-family: "JetBrains Mono", monospace; color: var(--gold); font-size: calc(var(--u) * 0.75); }
  .pname { font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 2.8); line-height: 1.05; }
  .big { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(var(--u) * 2); }
  .stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: calc(var(--u) * 0.4) calc(var(--u) * 0.8); margin-top: calc(var(--u) * 0.6); padding-top: calc(var(--u) * 0.6); border-top: 1px solid var(--line); }
  .stats .v { font-family: "JetBrains Mono", monospace; font-size: calc(var(--u) * 0.95); }
  .stats .label { font-size: calc(var(--u) * 0.65); white-space: nowrap; }
  .stats > div { white-space: nowrap; }
  .tonight { margin-top: calc(var(--u) * 0.7); padding: calc(var(--u) * 0.4) calc(var(--u) * 0.7); border-radius: calc(var(--u) * 0.7); background: rgba(232, 196, 106, 0.12); display: flex; justify-content: space-between; align-items: baseline; }
  .tonight .big { font-size: calc(var(--u) * 1.4); }

  /* newcomer */
  .newcomer {
    position: relative; overflow: hidden; text-align: center;
    background: linear-gradient(135deg, rgba(232,196,106,0.2), rgba(6,36,24,0.88) 60%);
    border: 2px solid var(--gold);
    animation: arrive 1.2s cubic-bezier(.2,1.4,.4,1) both, glow 2.8s ease-in-out 1.2s infinite, float 6s ease-in-out 1.2s infinite;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--u) * 0.4);
  }
  .newcomer::before {
    content: ""; position: absolute; inset: -60%;
    background: conic-gradient(from 0deg, transparent 0 70%, rgba(232,196,106,0.35) 80%, transparent 90%);
    animation: spin 5s linear infinite; z-index: -1;
  }
  .stamp {
    display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: 0.3em;
    padding: 0.3em 0.8em; border: 0.18em solid var(--gold); border-radius: 0.4em; font-size: calc(var(--u) * 1.1);
    transform: rotate(-6deg); color: var(--gold);
    animation: stamp 0.6s cubic-bezier(.3,1.8,.5,1) 0.9s both, shimmer 2.4s linear 1.5s infinite;
    background: linear-gradient(90deg, var(--gold) 0%, #fff4cf 50%, var(--gold) 100%); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .newcomer .pname { font-size: calc(var(--u) * 3.4); }
  .nc-sub { color: var(--muted); font-size: calc(var(--u) * 0.85); }
  @keyframes arrive { from { opacity: 0; transform: translateY(6vh) scale(0.85); } }
  @keyframes glow { 50% { box-shadow: 0 0 5vh rgba(232,196,106,0.45); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(3); } }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* tonight */
  .night { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: calc(var(--u) * 1.2); min-height: 0; }
  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: calc(var(--u) * 1.2); min-height: 0; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: calc(var(--u) * 0.45) calc(var(--u) * 0.3); text-align: left; font-size: calc(var(--u) * 1.15); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: calc(var(--u) * 0.72); text-transform: uppercase; letter-spacing: 0.12em; }
  tr + tr td { border-top: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-family: "JetBrains Mono", monospace; }
  .crown { color: var(--gold); }
  .pays { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 16), 1fr)); gap: 0 calc(var(--u) * 2); }
  .pay { display: flex; justify-content: space-between; gap: 1em; padding: calc(var(--u) * 0.3) 0; font-size: calc(var(--u) * 1.1); border-top: 1px solid var(--line); }
  .pay .arrow { color: var(--muted); }
  .headline { font-family: "DM Serif Display", serif; font-size: calc(var(--u) * 2.4); line-height: 1.1; }
  .recap-text { font-size: calc(var(--u) * 1.1); margin: calc(var(--u) * 0.4) 0 calc(var(--u) * 0.6); }
  .roast { display: grid; grid-template-columns: calc(var(--u) * 7) 1fr; gap: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.35) 0; border-top: 1px solid var(--line); font-size: calc(var(--u) * 0.98); }
  .roast .who { font-weight: 700; color: var(--gold); }
  .recap .mini { margin-top: calc(var(--u) * 0.6); }
  .recap .mini td { font-size: calc(var(--u) * 0.9); padding: calc(var(--u) * 0.2) calc(var(--u) * 0.3); }
  .welcome { display: grid; place-items: center; text-align: center; }
  .welcome .headline { font-size: calc(var(--u) * 3.2); }
  .welcome p { color: var(--muted); font-size: calc(var(--u) * 1.3); }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 0.4vh var(--gold); } }

  /* full-screen recap */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 4vh 5vw;
    background: rgba(3, 18, 12, 0.93); backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none; transition: opacity 0.6s;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .recap-big { max-width: 110vh; width: 100%; max-height: 92vh; overflow: hidden; }
  .recap-big .headline { font-size: calc(var(--u) * 5.2); }
  .recap-big .recap-text { font-size: calc(var(--u) * 1.7); }
  .recap-big .roast { font-size: calc(var(--u) * 1.6); grid-template-columns: calc(var(--u) * 11) 1fr; padding: calc(var(--u) * 0.6) 0; }
  .overlay.on .recap-big { animation: arrive 0.9s cubic-bezier(.2,1.3,.4,1) both; }
  .overlay.on .roast { animation: arrive 0.7s ease-out both; }
  .overlay.on .roast:nth-of-type(1) { animation-delay: .6s } .overlay.on .roast:nth-of-type(2) { animation-delay: 1.2s }
  .overlay.on .roast:nth-of-type(3) { animation-delay: 1.8s } .overlay.on .roast:nth-of-type(4) { animation-delay: 2.4s }
  .overlay.on .roast:nth-of-type(5) { animation-delay: 3s } .overlay.on .roast:nth-of-type(6) { animation-delay: 3.6s }
  .overlay.on .roast:nth-of-type(n+7) { animation-delay: 4.2s }

  /* pre-game: the crew cards take the stage */
  body.pregame main { grid-template-rows: auto minmax(0, 1fr) auto; }
  body.pregame .player { --u: calc(min(1vw, 1.78vh) * 1.3); display: flex; flex-direction: column; justify-content: center; }
  body.pregame .crew { align-items: center; }
  body.pregame .stats { grid-template-columns: 1fr 1fr; }
  body.pregame .welcome { padding: calc(var(--u) * 1.4); }
  body.pregame .welcome .headline { font-size: calc(var(--u) * 2.4); }

  @media (prefers-reduced-motion: reduce) {
    .player, .suits span, .live-dot, .newcomer, .newcomer::before, .stamp, .roast, .recap-big { animation: none !important; }
  }
</style>
</head>
<body>
<div class="suits" aria-hidden="true">
  <span style="left:6%;animation-delay:-2s">♠</span>
  <span style="left:28%;animation-delay:-11s">♥</span>
  <span style="left:52%;animation-delay:-19s">♣</span>
  <span style="left:77%;animation-delay:-6s">♦</span>
  <span style="left:90%;animation-delay:-24s">♠</span>
</div>
<main>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">Tonight</div>
      <h1 id="title">Poker Night</h1>
    </div>
    <div class="status"><div id="status">Loading…</div><div class="updated" id="updated"></div></div>
  </header>
  <section class="crew" id="crew"></section>
  <section class="night" id="night"></section>
</main>
<div id="overlay" class="overlay" aria-live="polite"></div>

<script>
const money = v => (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(2);
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let lastStamp = null;

function crewCard(p, i) {
  return `
    <article class="player">
      <div class="rank">#${i + 1} OF THE CREW</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="label">Lifetime</div>
      <div class="big ${cls(p.lifetime_net)}">${money(p.lifetime_net)}</div>
      <div class="stats">
        <div><div class="label">Record</div><div class="v">${p.wins}–${p.losses}</div></div>
        <div><div class="label">Win %</div><div class="v">${p.win_rate}%</div></div>
        <div><div class="label">Best</div><div class="v up">${money(p.best_night)}</div></div>
        <div><div class="label">Worst</div><div class="v down">${money(p.worst_night)}</div></div>
      </div>
      ${p.tonight != null ? `<div class="tonight"><span class="label">Tonight</span><span class="big ${cls(p.tonight)}">${money(p.tonight)}</span></div>` : ""}
    </article>`;
}

function newcomerCard(n) {
  return `
    <article class="player newcomer">
      <div class="stamp">NEWCOMER</div>
      <div class="pname">${esc(n.name)}</div>
      ${n.tonight != null
        ? `<div class="big ${cls(n.tonight)}">${money(n.tonight)}</div><div class="label">tonight</div>`
        : `<div class="nc-sub">First night at the table<br>Record: blank · Fear level: pending</div>`}
    </article>`;
}

function recapBlock(g, big) {
  const r = g.recap || {};
  const lines = Object.entries(r.lines || {}).map(([n, l]) =>
    `<div class="roast"><span class="who">${esc(n)}</span><span>${esc(l)}</span></div>`).join("");
  return `
    <div class="${big ? "recap-big" : "panel recap"}">
      <div class="ptitle">Game ${g.n} recap</div>
      <div class="headline">${esc(r.headline || "")}</div>
      <div class="recap-text">${esc(r.recap || "")}</div>
      ${lines}
    </div>`;
}

function renderNight(d) {
  if (!d.games.length) {
    return `<div class="panel welcome" style="grid-column: 1 / -1">
      <div><div class="headline">Shuffle up and deal</div>
      <p>Results, recaps and trash talk land here after every game.</p></div></div>`;
  }
  const standings = d.standings.map((s, i) => `
    <tr><td>${i === 0 && s.net > 0 ? '<span class="crown">♛</span> ' : ""}${esc(s.name)}</td>
    <td class="num">${s.won}/${s.games}</td>
    <td class="num up">${money(s.best)}</td>
    <td class="num down">${money(s.worst)}</td>
    <td class="num">${s.rebuys}</td>
    <td class="num">${s.busts}</td>
    <td class="num">$${s.bought_in.toFixed(0)}</td>
    <td class="num ${cls(s.net)}"><b>${money(s.net)}</b></td></tr>`).join("");
  const pays = d.settlements.length
    ? d.settlements.map(t => `<div class="pay"><span>${esc(t.from)} <span class="arrow">→</span> ${esc(t.to)}</span><span class="mono">$${t.amount.toFixed(2)}</span></div>`).join("")
    : `<div class="label">All square.</div>`;
  return `
    <div class="panel">
      <div class="ptitle">Tonight · ${d.games.length} game${d.games.length > 1 ? "s" : ""}</div>
      <table>
        <tr><th>Player</th><th class="num">Won</th><th class="num">Best</th><th class="num">Worst</th><th class="num">Rebuys</th><th class="num">Busts</th><th class="num">In</th><th class="num">Net</th></tr>
        ${standings}</table>
    </div>
    <div class="right">
      ${recapBlock(d.games[d.games.length - 1], false)}
      <div class="panel"><div class="ptitle">Who pays who</div><div class="pays">${pays}</div></div>
    </div>`;
}

// Full-screen recap once per game, and again when the real roast replaces the auto one.
let shown = null;
const recapKey = g => g.id + ":" + ((g.recap || {}).auto ? "a" : "r");
function maybeShowRecap(d, first) {
  if (!d.games.length) return;
  const g = d.games[d.games.length - 1];
  const key = recapKey(g);
  if (first) { shown = key; return; }
  if (key === shown) return;
  shown = key;
  const ov = document.getElementById("overlay");
  ov.innerHTML = recapBlock(g, true);
  ov.classList.add("on");
  clearTimeout(ov._t);
  ov._t = setTimeout(() => ov.classList.remove("on"), 35000);
}
document.getElementById("overlay").addEventListener("click", e => e.currentTarget.classList.remove("on"));

// Shrink a panel's text a notch at a time if a big table ever overflows it.
// Every size is derived from --u, so scaling --u on the panel scales it all.
function fit() {
  document.querySelectorAll(".night .panel").forEach(p => {
    p.style.removeProperty("--u");
    for (let s = 0.95; p.scrollHeight > p.clientHeight + 2 && s >= 0.55; s -= 0.05) {
      p.style.setProperty("--u", `calc(min(1vw, 1.78vh) * ${s.toFixed(2)})`);
    }
  });
}
window.addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    if (d.updated_at === lastStamp) return;
    const first = lastStamp === null;
    lastStamp = d.updated_at;
    document.title = `${d.title} at ${d.host}`;
    document.getElementById("eyebrow").textContent =
      new Date(d.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    document.getElementById("title").textContent = `${d.title} at ${d.host}`;
    document.getElementById("status").innerHTML = d.games.length
      ? `<span class="live-dot"></span>Live · ${d.games.length} game${d.games.length > 1 ? "s" : ""} in the books`
      : "Getting set up";
    document.getElementById("crew").innerHTML =
      d.featured.map(crewCard).join("") + (d.newcomers || []).map(newcomerCard).join("");
    document.body.classList.toggle("pregame", !d.games.length);
    const night = document.getElementById("night");
    night.innerHTML = renderNight(d);
    fit();
    setTimeout(fit, 800);
    if (!first) night.querySelectorAll(".panel").forEach(p => p.classList.add("flash"));
    maybeShowRecap(d, first);
    document.getElementById("updated").textContent =
      "Updated " + new Date(d.updated_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) {
    if (lastStamp === null) document.getElementById("status").textContent = "Couldn't load results. Retrying…";
  }
}

// Reload by itself when the page code changes, so the TV never needs a manual refresh.
let pageSig = null;
async function checkPage() {
  try {
    const t = await (await fetch("index.html?t=" + Date.now(), { cache: "no-store" })).text();
    const sig = t.length + ":" + t.slice(-400);
    if (pageSig && sig !== pageSig) location.reload();
    pageSig = pageSig || sig;
  } catch (e) {}
}

load();
checkPage();
setInterval(load, 20000);
setInterval(checkPage, 60000);
</script>
</body>
</html>
